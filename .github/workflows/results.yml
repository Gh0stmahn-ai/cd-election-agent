name: Election night results

# Reads the official state feeds and Wikipedia's race calls about once a
# minute, grades the sealed final forecast against them, and pushes the
# results file back to main (see results.py). Pages read that file straight
# from the repository, so a push is all it takes for every open page to update.
#
# One job can run for six hours at most, so the night is covered by a relay:
# a run starts every hour, each loops for 5 h 40 min, and the concurrency
# group below queues the next run behind the current one (GitHub keeps only
# the newest queued run and cancels older ones, which is expected and fine).
# Everything a run needs to carry on is in the committed data/results_state.json.

on:
  schedule:
    # 22:07 UTC Nov 3 is 5:07 pm Eastern, an hour before the first polls close.
    # Minute 7 rather than 0: the top of the hour is when GitHub's scheduler
    # is busiest and most likely to start a job late.
    - cron: '7 22,23 3 11 *'
    - cron: '7 * 4,5 11 *'
    - cron: '7 0-5 6 11 *'
    # After that the counting is slow (Alaska's ranked-choice rounds are on
    # November 18): a single read every half hour for the rest of November.
    - cron: '17,47 * 6-30 11 *'
    # A Georgia runoff, if a race goes to one, is on December 1.
    - cron: '17,47 * 1-3 12 *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to keep reading, in minutes (a rehearsal: 10)'
        required: false
        default: '30'
      push:
        description: 'Commit and push what it reads'
        type: boolean
        default: true
      branch:
        description: 'Branch to push to (use a scratch branch for a rehearsal)'
        required: false
        default: 'main'

permissions:
  contents: write

concurrency:
  group: election-results
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Alaska's server omits this intermediate certificate; see results_feeds.py.
      - name: Fetch the intermediate certificate Alaska's server leaves out
        continue-on-error: true
        run: |
          mkdir -p certs
          curl -fsSL --max-time 30 http://secure.globalsign.com/cacert/gsgccr46ovtlsca2025.crt \
            | openssl x509 -inform DER -out certs/globalsign-gcc-r46-ov-tls-ca-2025.pem
          openssl x509 -in certs/globalsign-gcc-r46-ov-tls-ca-2025.pem -noout -subject -issuer

      - name: Identify the bot
        run: |
          git config user.name "election-agent[bot]"
          git config user.email "actions@users.noreply.github.com"

      # Scheduled runs on November 3 to 6 loop; from November 6 on, the
      # half-hourly runs read once. A manual run loops for as long as asked.
      - name: Collect results
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MINUTES: ${{ inputs.minutes }}
          PUSH: ${{ inputs.push }}
          RESULTS_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$PUSH" = "true" ]; then
              python3 -u results.py loop --minutes "${MINUTES:-30}" --interval 60
            else
              python3 -u results.py loop --minutes "${MINUTES:-30}" --interval 60 --no-push
            fi
          elif [ "$SCHEDULE" = "17,47 * 6-30 11 *" ] || [ "$SCHEDULE" = "17,47 * 1-3 12 *" ]; then
            python3 -u results.py once --push
          else
            python3 -u results.py loop --minutes 340 --interval 60
          fi
