name: Daily election forecast update

# Runs the full pipeline once a day:
#   1. agent_run.py   - Claude + web search refreshes the generic ballot,
#                        any Senate rating changes, and the atmospherics
#                        read for toss-up/lean races (needs
#                        ANTHROPIC_API_KEY; skips itself gracefully if the
#                        secret isn't set, so the rest of the run still
#                        happens on seed/last-known data)
#   2. run_pipeline.py - Monte Carlo simulation -> new iterations/*.json
#   3. build_dashboard.py - folds the new iteration into dashboard.html
#   4. commit + push the changed data/iterations/dashboard back to main
#
# Trigger it manually any time from the Actions tab (workflow_dispatch)
# to test without waiting for the schedule.

on:
  schedule:
    # 16:00 UTC = noon Eastern during EDT (Mar-Nov). GitHub Actions cron
    # doesn't observe DST, so this drifts to 11:00 AM ET during EST
    # (Nov-Mar) - adjust to '0 17 * * *' for the winter half if you want
    # it pinned to exactly noon year-round.
    - cron: '0 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Agentic data refresh (ballot, ratings, atmospherics)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 agent_run.py

      - name: Run forecasting pipeline
        run: python3 run_pipeline.py

      - name: Rebuild dashboard with new iteration
        run: python3 build_dashboard.py

      - name: Commit and push updated data
        run: |
          git config user.name "election-agent[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/ iterations/ dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily forecast update: $(date -u +%Y-%m-%d)"
            git push
          fi
