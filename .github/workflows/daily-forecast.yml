name: Daily election forecast update

# Runs the full pipeline once a day, then publishes the site:
#   1. agent_run.py   - Claude + web search refreshes the generic ballot,
#                        approval, economic indicators, rating changes and
#                        Senate news momentum (needs ANTHROPIC_API_KEY; skips
#                        itself gracefully if the secret isn't set)
#   2. run_pipeline.py - Monte Carlo simulation -> new iterations/*.json
#   3. build_site.py    - rebuilds the multi-page site in site/
#   4. commit + push the changed data/iterations/site back to main
#   5. deploy job - publishes site/ to GitHub Pages
#
# Trigger it manually any time from the Actions tab (workflow_dispatch).

on:
  schedule:
    # 16:00 UTC = noon Eastern during EDT (Mar-Nov). GitHub Actions cron
    # doesn't observe DST, so this drifts to 11:00 AM ET during EST.
    - cron: '0 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Soft-fail on purpose. If the refresh dies partway through (API
      # credit exhausted, a source down, a rate limit), it has usually
      # already written some of today's data through ingest.py. Letting
      # the job continue means the model still re-simulates and the site
      # still rebuilds on the freshest data we have, and run_pipeline.py
      # flags whatever went stale in the snapshot's status block.
      - name: Agentic data refresh (ballot, approval, economy, ratings, momentum)
        id: refresh
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 agent_run.py

      - name: Note an incomplete data refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning title=Data refresh incomplete::agent_run.py exited non-zero. \
          The forecast below was rebuilt on the last-known data plus whatever \
          today's refresh managed to write before it stopped."

      - name: Run forecasting pipeline
        run: python3 run_pipeline.py

      - name: Rebuild the site with the new run
        run: python3 build_site.py

      - name: Commit and push updated data
        run: |
          git config user.name "election-agent[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/ iterations/ site/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily forecast update: $(date -u +%Y-%m-%d)"

          # Rebase onto the latest main and retry the push a few times in
          # case someone pushed (or another run finished) in between this
          # job's checkout and now.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict against origin/main - aborting. A human needs to look at this run."
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed (remote moved again) - retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push after 5 attempts."
          exit 1

  # Publish the freshly built site. Pushes made by the workflow's own
  # token don't trigger other workflows, so the deploy has to live here
  # rather than relying on pages.yml's push trigger.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          cp -r site _site
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
