name: Daily election forecast update

# Runs the full pipeline once a day, then publishes the site:
#   1. refresh_economy.py - pulls all 10 economic readings from public data
#                           series. FREE: no API key, no cost, no LLM.
#   2. refresh_markets.py - Kalshi and Polymarket prices, also free. Shown
#                           beside the model, never blended into it.
#   3. refresh_polls.py   - generic ballot and approval, averaged from the
#                           aggregator tables Wikipedia maintains. Free.
#   4. refresh_news.py    - GDELT news tone per race. Free, and collected
#                           for display only; it never moves a number.
#   5. set_polls.py       - overrides the two poll figures with anything you
#                           typed into the boxes below.
#   6. agent_run.py       - the AI refresh: reads polling pages, Cook rating
#                           changes and Senate campaign coverage. This is the
#                           only step that SPENDS ANTHROPIC API CREDITS, so it
#                           is off by default and opt-in per run.
#   7. run_pipeline.py    - Monte Carlo simulation -> new iterations/*.json
#   8. build_site.py      - rebuilds the multi-page site in site/
#   9. commit + push the changed data/iterations/site back to main
#   10. deploy job - publishes site/ to GitHub Pages
#
# A scheduled run costs nothing and still refreshes the whole economy.
# The Refresh control on the site links straight to this workflow.

on:
  schedule:
    # 16:00 UTC = noon Eastern during EDT (Mar-Nov). GitHub Actions cron
    # doesn't observe DST, so this drifts to 11:00 AM ET during EST.
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      generic_ballot:
        description: 'Generic ballot, e.g. D+6.6 or R+2.1 (blank keeps the current number)'
        required: false
        default: ''
      approval:
        description: 'Approval as approve/disapprove, e.g. 38/60 (blank keeps it)'
        required: false
        default: ''
      ai_refresh:
        description: 'Also run the AI refresh (ratings + Senate news). Spends Anthropic API credits.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Free, and the reason a run costs nothing: every economic reading comes
      # from a public series (BLS, BEA, EIA, Treasury, Freddie Mac, U. Michigan)
      # served as keyless CSV by FRED. Soft-fail, because one unreachable
      # series is no reason to throw away the rest of the run.
      - name: Refresh the economy from public data (free)
        id: economy
        continue-on-error: true
        run: python3 refresh_economy.py

      # Also free. Prices are shown next to the model on the markets page and
      # are never blended into the forecast, so a failure here costs a
      # comparison, not the forecast.
      - name: Refresh prediction market prices (free)
        id: markets
        continue-on-error: true
        run: python3 refresh_markets.py

      # Also free. Wikipedia keeps a maintained table of the major poll
      # aggregators for both the generic ballot and approval, which is a
      # better source than any single tracker and needs no key.
      - name: Refresh poll averages from Wikipedia (free)
        id: polls
        continue-on-error: true
        run: python3 refresh_polls.py

      # Free, and experimental. GDELT throttles by IP and may refuse a shared
      # runner outright; the script gives up quickly and says so if it does.
      # Nothing it collects is fed into the forecast.
      - name: Refresh news tone (free, display only)
        id: news
        continue-on-error: true
        run: python3 refresh_news.py

      # Typed numbers win over the automatic refresh above, so this runs last
      # of the poll steps: it is the override, not the only way in.
      - name: Apply any poll numbers entered by hand
        env:
          GENERIC_BALLOT: ${{ inputs.generic_ballot }}
          APPROVAL: ${{ inputs.approval }}
        run: python3 set_polls.py

      # The only paid step. Off unless you tick the box on a manual run, or set
      # a repository variable AI_REFRESH=true to let scheduled runs use it too
      # (Settings -> Secrets and variables -> Actions -> Variables).
      - name: AI refresh - ratings and Senate news momentum (uses API credits)
        id: refresh
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.ai_refresh) ||
          (github.event_name != 'workflow_dispatch' && vars.AI_REFRESH == 'true')
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 agent_run.py

      - name: Note an incomplete refresh
        if: steps.economy.outcome == 'failure' || steps.markets.outcome == 'failure' || steps.polls.outcome == 'failure' || steps.refresh.outcome == 'failure'
        run: |
          echo "::warning title=Refresh incomplete::A refresh step exited non-zero \
          (economy: ${{ steps.economy.outcome }}, markets: ${{ steps.markets.outcome }}, \
          polls: ${{ steps.polls.outcome }}, news: ${{ steps.news.outcome }}, \
          AI: ${{ steps.refresh.outcome }}). The forecast was rebuilt on the freshest data \
          available; every reading shows its own as-of date on the site."

      - name: Run forecasting pipeline
        run: python3 run_pipeline.py

      - name: Rebuild the site with the new run
        run: python3 build_site.py

      - name: Commit and push updated data
        run: |
          git config user.name "election-agent[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/ iterations/ site/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily forecast update: $(date -u +%Y-%m-%d)"

          # Rebase onto the latest main and retry the push a few times in
          # case someone pushed (or another run finished) in between this
          # job's checkout and now.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict against origin/main - aborting. A human needs to look at this run."
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed (remote moved again) - retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push after 5 attempts."
          exit 1

  # Publish the freshly built site. Pushes made by the workflow's own
  # token don't trigger other workflows, so the deploy has to live here
  # rather than relying on pages.yml's push trigger.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          cp -r site _site
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
